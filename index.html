<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Saver</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 id="header-title" class="pulse-glow">Bookmark Saver</h1>
        <div class="input-container">
            <div class="search-container">
            <input type="text" id="search-bar" placeholder="Search bookmarks or tags!">
            </div>
            <input type="text" id="bookmark-id" placeholder="Bookmark Name">
            <input type="text" id="bookmark-url" placeholder="Bookmark URL">
            <input type="text" id="bookmark-tags" placeholder="Tags (Optional)">
            <button id="add-bookmark">Add Bookmark</button>
        </div>

        <div class="sort-container">
            <button class="sort-btn" data-sort="name-asc">Name (A-Z)</button>
            <button class="sort-btn" data-sort="name-desc">Name (Z-A)</button>
            <button class="sort-btn" data-sort="date-newest">Newest First</button>
            <button class="sort-btn" data-sort="date-oldest">Oldest First</button>
            <button class="sort-btn" data-sort="tags">Sort by Tags</button>
        </div>

        <ul id="bookmark-list">
            <!-- Bookmarks will be added here -->
        </ul>

        

    </div>
    <script src="script.js"></script>
</body>
</html>
